spring:
  application:
    name: relax-server
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    default: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
  jackson:
    time-zone: Asia/Shanghai

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

relax:
  auth:
    token-ttl: ${AUTH_TOKEN_TTL:7d}
    bootstrap-super-admin-open-id: ${BOOTSTRAP_SUPER_ADMIN_OPEN_ID:}
  file:
    grant-ttl: ${FILE_GRANT_TTL:10m}
